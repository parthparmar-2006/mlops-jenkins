<!DOCTYPE html>
<html>
<head>
    <title>Saved Records</title>
</head>
<body>
    <h2>Saved Records</h2>

    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th><th>Sepal length</th><th>Sepal width</th>
            <th>Petal length</th><th>Petal width</th><th>Prediction</th>
        </tr>
        {% for r in records %}
        <tr>
            <td>{{ r.id }}</td><td>{{ r.sepal_length }}</td><td>{{ r.sepal_width }}</td>
            <td>{{ r.petal_length }}</td><td>{{ r.petal_width }}</td><td>{{ r.prediction }}</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/">Back</a></p>
</body>
</html>
